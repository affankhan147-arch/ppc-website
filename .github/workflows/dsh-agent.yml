name: DSH agent (free Gemini)

# Does up to 10 OPEN/FIX tasks (+1 WRITER article) in docs/dsh/TASKS.md on a dsh/* branch and pushes it.
# Never touches master: Claude's daily audit reviews and merges.
# Free models only: every free Gemini Flash model (GEMINI_API_KEY), plus OpenRouter/Groq/Mistral/Cerebras
# free tiers when their key is a repo secret. Switches model automatically on limits/errors.
on:
  schedule:
    - cron: "23 8 * * *"   # 13:23 PKT, just after Gemini's free daily quota resets
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "How many tasks to do this run"
        default: "10"

permissions:
  contents: write
  models: read

concurrency:
  group: dsh-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          python -m pip install --quiet aider-chat
      - name: Run DSH agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_MODELS: ${{ vars.DSH_MODELS }}
          DSH_MAX_TASKS: ${{ github.event.inputs.max_tasks || '10' }}
          DSH_MAX_WRITER: "1"   # fallback: the cloud also writes 1 WRITER article per run if the DSH app's Article Writer hasn't (it skips tasks that already have a branch)
          DSH_CHECKS: "npm run build;;node scripts/qa-check.mjs"
          DSH_HEALTH: "npm run typecheck;;npm run lint;;npm run check:images;;npm run build;;node scripts/qa-check.mjs"
        run: python scripts/dsh-agent.py
