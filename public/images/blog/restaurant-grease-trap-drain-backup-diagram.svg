<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
  <title id="t">Restaurant drain backup: grease trap vs. main line</title>
  <desc id="d">Kitchen drains flow into the grease trap, then past the sewer cleanout to the city sewer. If only kitchen drains back up, the grease trap is the likely problem; if restrooms back up too, the clog is likely in the main line past the trap.</desc>
  <rect width="640" height="360" fill="#0f172a"/>
  <text x="24" y="34" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Restaurant drain backup: where is the clog?</text>
  <text x="24" y="54" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Kitchen drains feed the grease trap first, then the main line to the city sewer</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="24" y="78" width="112" height="34" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="80" y="99" text-anchor="middle">3-compartment sink</text>
    <rect x="24" y="120" width="112" height="34" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="80" y="141" text-anchor="middle">Dish machine</text>
    <rect x="24" y="162" width="112" height="34" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="80" y="183" text-anchor="middle">Floor drains</text>
    <rect x="24" y="236" width="112" height="34" rx="6" fill="#1e293b" stroke="#a78bfa"/>
    <text x="80" y="257" text-anchor="middle">Restrooms</text>
  </g>
  <path d="M136 95 H170 M136 137 H170 M136 179 H170 M170 95 V179 M170 137 H230" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="230" y="108" width="120" height="62" rx="8" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
  <rect x="236" y="140" width="108" height="24" rx="4" fill="#a16207" opacity="0.6"/>
  <text x="290" y="128" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">GREASE TRAP</text>
  <text x="290" y="157" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI, Arial, sans-serif" font-size="10">fats, oils &amp; grease</text>
  <path d="M350 139 H430 V253" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M136 253 H470" stroke="#a78bfa" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="418" y="196" width="24" height="18" rx="3" fill="#334155" stroke="#e2e8f0"/>
  <text x="456" y="209" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Sewer cleanout</text>
  <path d="M470 253 H600" stroke="#64748b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="535" y="243" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Main line to city sewer</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5">
    <circle cx="36" cy="298" r="9" fill="#f59e0b"/><text x="36" y="302" text-anchor="middle" fill="#0f172a" font-weight="700">1</text>
    <text x="52" y="302" fill="#f8fafc">Only kitchen drains backing up? The grease trap (or the line into it) is the likely clog.</text>
    <circle cx="36" cy="322" r="9" fill="#a78bfa"/><text x="36" y="326" text-anchor="middle" fill="#0f172a" font-weight="700">2</text>
    <text x="52" y="326" fill="#f8fafc">Restrooms backing up too? The clog is more likely in the main line past the trap.</text>
    <circle cx="36" cy="346" r="9" fill="#ef4444"/><text x="36" y="350" text-anchor="middle" fill="#0f172a" font-weight="700">3</text>
    <text x="52" y="350" fill="#f8fafc">Water rising at a floor drain or cleanout? Stop all water use and call a commercial plumber.</text>
  </g>
</svg>
